name: CI

# Doc 03 §12 : vérifie install / typecheck / lint / test / build:web sur PR et
# sur `main`, en prouvant que la plage `engines` tient sous Node 22 LTS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node 22, pnpm 9)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Turbo et Expo coupent leur télémétrie (`CI=true` est déjà posé par
      # GitHub Actions, inutile de le redéclarer).
      DO_NOT_TRACK: "1"
      # Les tests d'intégration utilisent la vraie base (doc 03 §8) : le
      # `globalSetup` de Vitest applique `prisma migrate deploy` avant la suite.
      DATABASE_URL: postgresql://focus:focus@localhost:5432/focus_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-0000000000000000000000000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: focus
          POSTGRES_PASSWORD: focus
          POSTGRES_DB: focus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focus -d focus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `.nvmrc` contient `22` : setup-node résout la dernière 22.x LTS. Hors de
      # `engines`, `pnpm install` échoue en ERR_PNPM_UNSUPPORTED_ENGINE (via
      # `engine-strict=true`) : un décalage de version ne peut pas passer.
      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm vient de Corepack, épinglé par `packageManager` : aucune version
      # écrite ici, donc aucune dérive avec le dépôt. L'écho sert de trace.
      - name: Enable corepack and resolve pinned pnpm
        run: |
          corepack enable
          echo "node $(node -v) / pnpm $(pnpm -v)"

      # Seul garde-fou conservé : désactiver `engine-strict` ne ferait échouer
      # aucune étape, mais priverait la CI de sa valeur de preuve. `pnpm config
      # get` lit la valeur réellement appliquée (`.npmrc` + environnement).
      - name: Assert engine-strict is enforced
        run: test "$(pnpm config get engine-strict)" = true || { echo "::error::engine-strict is disabled"; exit 1; }

      # Étapes séparées volontairement : GitHub affiche l'étape fautive et permet
      # de relancer un seul job, ce qu'un unique `pnpm ... && pnpm ...` ne donne pas.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Prouve que le seed de M0 s'exécute sur le schéma migré (idempotent).
      - name: Seed
        run: pnpm --filter @focus/api db:seed

      # Doc 03 §6.1 : `openapi.json` est commité, donc le contrat ne peut pas
      # changer sans que le fichier suive. La génération dépend de
      # `@focus/contracts`, que le script construit lui-même.
      - name: OpenAPI drift check
        run: pnpm api:openapi:check

      - name: Build web (Expo export)
        run: pnpm build:web
